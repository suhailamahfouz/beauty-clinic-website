<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Profile - The Beauty Clinic</title>
    
    <!-- ملفات الـ CSS الأساسية -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    
    <link rel="icon" href="images/logo.png" type="image/png" />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        /* ==========================================
           CSS مخصص لصفحة بروفايل الدكتور
           ========================================== */
         .navbar {
            margin-top: -160px;
        }
        .profile-container {
            max-width: 1100px;
            margin: 160px auto 60px auto; 
            padding: 0 20px;
            position: relative;
            z-index: 10; 
        }

        .profile-card {
            background: #ffffff; 
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.08); 
            display: flex;
            flex-direction: row; /* 👈 هنا التعديل: الصورة شمال والكلام يمين */
            overflow: hidden; 
            border: 1px solid rgba(216, 27, 96, 0.05);
        }

        .profile-image-col {
            flex: 0 0 45%; /* الصورة واخدة 45% من مساحة المستطيل */
        }

        .profile-image-col img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .profile-info-col {
            flex: 1; /* الكلام واخد باقي المساحة (55%) */
            padding: 50px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .profile-name {
            font-family: 'Playfair Display', serif;
            font-size: 38px;
            color: #333;
            margin-bottom: 5px;
        }

        .profile-title {
            color: var(--primary-pink);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .profile-desc {
            color: #666;
            line-height: 1.8;
            margin-bottom: 30px;
            font-size: 16px;
        }

        .profile-stats {
            display: flex;
            gap: 40px;
            margin-bottom: 40px;
            border-top: 1px solid #f0f0f0;
            padding-top: 25px;
        }

        .stat-item h4 {
            color: var(--primary-pink);
            font-size: 24px;
            margin-bottom: 5px;
        }

        .stat-item p {
            color: #888;
            font-size: 14px;
            margin: 0;
            font-weight: 500;
        }

        .btn-book-profile {
            display: inline-block;
            background: var(--primary-pink);
            color: white;
            padding: 15px 40px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 600;
            text-align: center;
            transition: all 0.3s ease;
            align-self: flex-start; 
            box-shadow: 0 5px 15px rgba(216, 27, 96, 0.25);
        }

        .btn-book-profile:hover {
            background: #b51550;
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(216, 27, 96, 0.35);
        }

        /* ريسبونسف (للموبايل بس هو اللي بينزلهم تحت بعض عشان الشاشة صغيرة) */
        @media (max-width: 850px) {
            .profile-card {
                flex-direction: column; 
            }
            .profile-image-col {
                width: 100%;
                height: 400px;
            }
            .profile-info-col {
                padding: 30px 25px;
            }
            .profile-name {
                font-size: 30px;
            }
        }
    </style>
</head>
<body class="specialists-page-body">

    <!-- Navbar -->
    <header class="navbar">
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="services.html">Services</a></li>
            <li><a href="specialists.html" class="active">Specialists</a></li>
            <li><a href="gallery.html">Gallery</a></li>
        </ul>
        <div class="logo">
            <a href="index.html" class="logo-container">
                <img src="images/logo.png" alt="Beauty Clinic Logo">
                <h2>The <span>Beauty</span> Clinic</h2>
            </a>
        </div>
        <ul class="nav-links">
            <li><a href="products.html">Products</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
        <a href="booking.html" class="btn-book-nav">BOOK NOW</a>
    </header>

    <!-- حاوية بيانات الدكتور -->
    <div class="profile-container" id="doctorProfileContent">
        <!-- الجافاسكريبت هيرمي الكارت هنا -->
    </div>

    <!-- ربط الجافاسكريبت -->

</body>
</html>
